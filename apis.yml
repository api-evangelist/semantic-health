name: Semantic Health
description: >-
  Semantic Health was a Toronto-based artificial-intelligence company applying
  natural-language processing and machine learning to autonomous medical coding and
  clinical-documentation auditing for hospitals and health systems. Backed by DCVC and
  Y Combinator, it was acquired by AAPC in 2023 and folded into AAPC's coding and
  auditing product line. The company operates no standalone public developer surface;
  its primary domain (semantichealth.ai) no longer resolves, and semantichealth.com now
  permanently redirects (HTTP 301) to aapc.com. No public API, developer portal, OpenAPI
  specification, SDKs, or documentation were found during enrichment.
